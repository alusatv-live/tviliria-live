
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVIliria LIVE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #000;
color: white;
font-family: Arial, sans-serif;
text-align: center;
}

header {
padding: 18px 10px;
background: #111;
border-bottom: 2px solid #c40000;
}

.logo {
font-size: 30px;
font-weight: bold;
}

.logo span {
color: #e00000;
}

.player {
width: 100%;
max-width: 1000px;
margin: 20px auto 10px;
background: #000;
position: relative;
aspect-ratio: 16 / 9;
overflow: hidden;
}

video {
width: 100%;
height: 100%;
display: block;
background: #000;
object-fit: contain;
}

.status {
padding: 12px;
color: #aaa;
font-size: 15px;
}

.articles-button {
display: inline-block;
margin: 15px auto 30px;
padding: 13px 20px;
background: #d4af00;
color: #000;
font-weight: bold;
text-decoration: none;
border-radius: 6px;
}

.articles-button:hover {
background: #f0c400;
}

footer {
padding: 25px;
color: #777;
border-top: 1px solid #222;
}
</style>
</head>

<body>

<header>
<div class="logo">
TV<span>Iliria</span> LIVE
</div>
</header>

<div class="player">
<video id="video" controls playsinline></video>
</div>

<div id="status" class="status">
Po lidhemi me TVIliria LIVE...
</div>

<a href="artikuj.html" class="articles-button">
📰 ARTIKUJT TVILIRIA
</a>

<footer>
© 2026 TVIliria — Albanian Media in America
</footer>

<script>

const video = document.getElementById("video");
const status = document.getElementById("status");

const streamURL =
"https://lbgo.bozztv.com/ssh101/ssh101/albanianusa/chunks.m3u8?lb_backend_hint=7";

if (video.canPlayType("application/vnd.apple.mpegurl")) {

video.src = streamURL;

video.addEventListener("loadedmetadata", function() {
status.textContent = "🔴 TVIliria LIVE";
});

} else if (Hls.isSupported()) {

const hls = new Hls({
enableWorker: true,
lowLatencyMode: true
});

hls.loadSource(streamURL);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED, function() {
status.textContent = "🔴 TVIliria LIVE";
});

hls.on(Hls.Events.ERROR, function(event, data) {
if (data.fatal) {
status.textContent = "Po përpiqemi të rilidhemi me TVIliria LIVE...";
}
});

} else {

status.textContent = "Shfletuesi nuk mbështet LIVE TV.";
}

</script>

</body>
</html>
