
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVIliria LIVE</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #000;
color: white;
font-family: Arial, sans-serif;
text-align: center;
}

header {
padding: 18px 10px;
background: #111;
border-bottom: 2px solid #c40000;
}

.logo {
font-size: 30px;
font-weight: bold;
}

.logo span {
color: #e00000;
}

.player {
width: 100%;
max-width: 1000px;
margin: 20px auto 10px;
aspect-ratio: 16 / 9;
background: #000;
position: relative;
}

video {
width: 100%;
height: 100%;
display: block;
background: #000;
object-fit: contain;
}

.playButton {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 90px;
height: 90px;
border-radius: 50%;
border: none;
background: #d00000;
color: white;
font-size: 42px;
cursor: pointer;
}

.status {
padding: 12px;
color: #aaa;
}

.articles-button {
display: inline-block;
margin: 15px auto 30px;
padding: 13px 20px;
background: #d4af00;
color: #000;
font-weight: bold;
text-decoration: none;
border-radius: 6px;
}

footer {
padding: 25px;
color: #777;
border-top: 1px solid #222;
}
</style>
</head>

<body>

<header>
<div class="logo">
TV<span>Iliria</span> LIVE
</div>
</header>

<div class="player">

<video
id="video"
controls
muted
playsinline
preload="none">
</video>

<button id="playButton" class="playButton">
▶
</button>

</div>

<div id="status" class="status">
Shtyp ▶ për të parë TVIliria LIVE
</div>

<a href="artikuj.html" class="articles-button">
📰 ARTIKUJT TVILIRIA
</a>

<footer>
© 2026 TVIliria — Albanian Media in America
</footer>

<script>

const video = document.getElementById("video");
const playButton = document.getElementById("playButton");
const status = document.getElementById("status");

const streamURL =
"/api/proxy";

let hls = null;

playButton.addEventListener("click", async function () {

playButton.style.display = "none";
status.textContent = "Po lidhemi me TVIliria LIVE...";

/*
* Safari / iPhone / iPad
*/
if (video.canPlayType("application/vnd.apple.mpegurl")) {

video.src = streamURL;

try {
await video.play();
status.textContent = "🔴 TVIliria LIVE";
} catch (error) {
status.textContent = "Shtyp Play te kontrollet e videos.";
playButton.style.display = "block";
}

return;
}

/*
* Chrome / Edge / Firefox
*/
if (Hls.isSupported()) {

hls = new Hls({
enableWorker: true,
lowLatencyMode: true,
maxBufferLength: 10
});

hls.loadSource(streamURL);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED, async function () {

try {
await video.play();
status.textContent = "🔴 TVIliria LIVE";
} catch (error) {
status.textContent =
"Shtyp Play te kontrollet e videos.";
playButton.style.display = "block";
}

});

hls.on(Hls.Events.ERROR, function (event, data) {

if (data.fatal) {
status.textContent =
"Nuk u lidh me TVIliria LIVE. Provo përsëri.";
playButton.style.display = "block";
}

});

return;
}

status.textContent =
"Shfletuesi nuk mbështet këtë LIVE stream.";

playButton.style.display = "block";
});

</script>

</body>
</html>
