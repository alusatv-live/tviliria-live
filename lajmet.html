
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVIliria - Lajmet e Fundit</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
background: #050505;
color: white;
font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
background: linear-gradient(135deg, #080808, #1b1b1b);
padding: 22px 15px;
text-align: center;
border-bottom: 3px solid #c40000;
}

.logo {
font-size: 36px;
font-weight: bold;
letter-spacing: 1px;
}

.logo span {
color: #e00000;
}

.subtitle {
color: #d4af00;
margin-top: 6px;
font-size: 15px;
font-weight: bold;
}

/* NAV */

.nav {
display: flex;
justify-content: center;
gap: 8px;
padding: 10px;
background: #0d0d0d;
border-bottom: 1px solid #292929;
}

.nav a {
color: white;
text-decoration: none;
font-size: 14px;
font-weight: bold;
padding: 10px 16px;
border-radius: 5px;
}

.nav a:hover {
background: #d4af00;
color: #000;
}

/* CONTAINER */

.container {
width: 94%;
max-width: 1050px;
margin: 28px auto 50px;
}

.page-title {
font-size: 28px;
font-weight: bold;
border-left: 6px solid #d00000;
padding: 14px 17px;
background: linear-gradient(90deg, #151515, #0b0b0b);
margin-bottom: 12px;
border-radius: 4px;
}

.page-intro {
color: #999;
font-size: 15px;
line-height: 1.6;
margin-bottom: 22px;
}

/* NEWS CARD */

.news {
background: linear-gradient(145deg, #151515, #0b0b0b);
border: 1px solid #292929;
border-radius: 10px;
padding: 24px;
margin-bottom: 20px;
box-shadow: 0 5px 20px rgba(0,0,0,0.35);
}

.news:hover {
border-color: #d4af00;
}

.news h2 {
margin: 0 0 10px;
font-size: 23px;
line-height: 1.3;
}

.date {
color: #d4af00;
font-size: 14px;
font-weight: bold;
margin-bottom: 15px;
}

.summary {
color: #ccc;
line-height: 1.7;
font-size: 16px;
}

.read {
display: inline-block;
margin-top: 18px;
padding: 12px 20px;
background: #d4af00;
color: #000;
border-radius: 5px;
font-weight: bold;
cursor: pointer;
text-decoration: none;
}

.read:hover {
background: #f0c800;
}

/* FOOTER */

footer {
padding: 30px 15px;
text-align: center;
color: #777;
border-top: 1px solid #222;
background: #080808;
}

/* MOBILE */

@media (max-width: 600px) {

.logo {
font-size: 30px;
}

.page-title {
font-size: 22px;
}

.news h2 {
font-size: 20px;
}

.nav {
flex-wrap: wrap;
}

.nav a {
font-size: 13px;
padding: 9px 12px;
}

.news {
padding: 20px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
TV<span>Iliria</span>
</div>

<div class="subtitle">
Jeto si shqiptarë në Amerikë
</div>

</header>


<div class="nav">

<a href="index.html#contact">
NA KONTAKTONI
</a>

<a href="lajmet.html">
LAJMET E FUNDIT
</a>

</div>


<div class="container">

<div class="page-title">
📰 LAJMET E FUNDIT
</div>

<div class="page-intro">
Lajmet, reportazhet dhe informacionet më të fundit nga Shqipëria, Kosova, trevat shqiptare dhe diaspora.
</div>

<div id="newsContainer">
Po ngarkohen lajmet...
</div>

</div>


<footer>
© 2026 TVIliria — Albanian Media in America
</footer>


<script>

function formatDate(dateString) {

const date = new Date(dateString);

return date.toLocaleDateString("sq-AL", {
day: "2-digit",
month: "long",
year: "numeric",
timeZone: "America/Chicago"
});

}


function stripHTML(html) {

const temp = document.createElement("div");

temp.innerHTML = html;

return temp.textContent || temp.innerText || "";

}


async function loadNews() {

const container =
document.getElementById("newsContainer");

try {

const response = await fetch(
"https://public-api.wordpress.com/wp/v2/sites/tviliria.wordpress.com/posts?per_page=10"
);

if (!response.ok) {
throw new Error("WordPress nuk u përgjigj");
}

const posts = await response.json();

container.innerHTML = "";


if (!posts.length) {

container.innerHTML =
"<p>Nuk ka lajme të publikuara.</p>";

return;

}


posts.forEach(function(post) {

const article =
document.createElement("article");

article.className = "news";


const title =
post.title.rendered;


const summary =
stripHTML(post.excerpt.rendered);


const articleDate =
formatDate(post.date);


article.innerHTML = `

<h2>
${title}
</h2>

<div class="date">
📅 ${articleDate}
</div>

<div class="summary">
${summary}
</div>

<a href="${post.link}" class="read" target="_blank">
LEXO MË SHUMË →
</a>

`;


container.appendChild(article);

});


} catch (error) {

console.error(error);

container.innerHTML =
"<p>Nuk u ngarkuan lajmet nga WordPress.</p>";

}

}


loadNews();

</script>

</body>
</html>
