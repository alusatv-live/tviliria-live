
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lajmet TVIliria</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #050505;
color: white;
font-family: Arial, sans-serif;
}

header {
background: #111;
border-bottom: 3px solid #c40000;
padding: 20px 10px;
text-align: center;
}

.logo {
font-size: 32px;
font-weight: bold;
}

.logo span {
color: #e00000;
}

.subtitle {
color: #aaa;
margin-top: 6px;
font-size: 14px;
}

.container {
width: 92%;
max-width: 1000px;
margin: 25px auto;
}

.back {
display: inline-block;
margin-bottom: 20px;
padding: 10px 16px;
background: #d00000;
color: white;
text-decoration: none;
border-radius: 5px;
font-weight: bold;
}

.title {
border-left: 5px solid #d00000;
padding: 10px 14px;
background: #111;
font-size: 24px;
font-weight: bold;
margin-bottom: 18px;
}

.news {
background: #111;
border: 1px solid #292929;
border-radius: 8px;
padding: 20px;
margin-bottom: 18px;
}

.news h2 {
margin: 0 0 8px;
font-size: 21px;
}

.date {
color: #d4af00;
font-size: 14px;
margin-bottom: 14px;
}

.summary {
color: #ccc;
line-height: 1.6;
}

.full {
display: none;
margin-top: 18px;
color: #ddd;
line-height: 1.8;
}

.read {
margin-top: 18px;
padding: 11px 18px;
background: #d4af00;
color: #000;
border: none;
border-radius: 5px;
font-weight: bold;
cursor: pointer;
}

footer {
margin-top: 40px;
padding: 25px;
text-align: center;
color: #777;
border-top: 1px solid #222;
}
</style>
</head>

<body>

<header>

<div class="logo">
TV<span>Iliria</span>
</div>

<div class="subtitle">
Zëri i shqiptarëve në Amerikë
</div>

</header>

<div class="container">

<a href="index.html" class="back">
🔴 LIVE TV
</a>

<div class="title">
📰 LAJMET E FUNDIT
</div>

<div id="newsContainer">
Po ngarkohen lajmet...
</div>

</div>

<footer>
© 2026 TVIliria — Albanian Media in America
</footer>

<script>

async function loadNews() {

const container =
document.getElementById("newsContainer");

try {

const response =
await fetch("news/lajmi1.json");

if (!response.ok) {
throw new Error("Lajmi nuk u gjet");
}

const news = await response.json();

container.innerHTML = `

<article class="news">

<h2>
${news.titulli}
</h2>

<div class="date">
${news.data}
</div>

<div class="summary">
${news.permbledhje}
</div>

<button class="read" onclick="showNews()">
LEXO MË SHUMË
</button>

<div class="full" id="fullNews">
<p>
${news.teksti}
</p>
</div>

</article>

`;

} catch (error) {

container.innerHTML =
"<p>Nuk u ngarkua lajmi.</p>";

}

}

function showNews() {

document.getElementById("fullNews").style.display =
"block";

}

loadNews();

</script>

</body>
</html>
