
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lajmet TVIliria</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #050505;
color: white;
font-family: Arial, sans-serif;
}

/* HEADER */
header {
background: linear-gradient(135deg, #080808, #1b1b1b);
padding: 22px 15px;
text-align: center;
border-bottom: 3px solid #c40000;
}

.logo {
font-size: 36px;
font-weight: bold;
letter-spacing: 1px;
}

.logo span {
color: #e00000;
}

.subtitle {
color: #aaa;
margin-top: 6px;
font-size: 14px;
}

/* NAV */
.nav {
text-align: center;
padding: 15px 10px;
background: #0d0d0d;
border-bottom: 1px solid #222;
}

.live {
display: inline-block;
background: #d00000;
color: white;
padding: 10px 20px;
border-radius: 5px;
text-decoration: none;
font-weight: bold;
}

/* CONTAINER */
.container {
width: 94%;
max-width: 1050px;
margin: 25px auto 50px;
}

.page-title {
font-size: 27px;
font-weight: bold;
border-left: 6px solid #d00000;
padding: 12px 15px;
background: linear-gradient(90deg, #151515, #0b0b0b);
margin-bottom: 22px;
}

/* NEWS CARD */
.news {
background: linear-gradient(145deg, #151515, #0b0b0b);
border: 1px solid #292929;
border-radius: 10px;
padding: 22px;
margin-bottom: 20px;
box-shadow: 0 5px 20px rgba(0,0,0,0.35);
}

.news h2 {
margin: 0 0 10px;
font-size: 23px;
line-height: 1.3;
}

.date {
color: #d4af00;
font-size: 14px;
font-weight: bold;
margin-bottom: 15px;
}

.summary {
color: #ccc;
line-height: 1.7;
font-size: 16px;
}

.full {
display: none;
margin-top: 20px;
padding-top: 18px;
border-top: 1px solid #333;
color: #ddd;
line-height: 1.8;
font-size: 16px;
}

/* BUTTON */
.read {
margin-top: 18px;
padding: 12px 20px;
background: #d4af00;
color: #000;
border: none;
border-radius: 5px;
font-weight: bold;
cursor: pointer;
}

.read:hover {
background: #f0c800;
}

/* FOOTER */
footer {
padding: 30px 15px;
text-align: center;
color: #777;
border-top: 1px solid #222;
background: #080808;
}

/* MOBILE */
@media (max-width: 600px) {

.logo {
font-size: 30px;
}

.page-title {
font-size: 22px;
}

.news h2 {
font-size: 20px;
}

}
</style>
</head>

<body>

<header>

<div class="logo">
TV<span>Iliria</span>
</div>

<div class="subtitle">
Zëri i shqiptarëve në Amerikë
</div>

</header>

<div class="nav">

<a href="index.html" class="live">
🔴 LIVE TV
</a>

</div>

<div class="container">

<div class="page-title">
📰 LAJMET E FUNDIT
</div>

<div id="newsContainer">
Po ngarkohen lajmet...
</div>

</div>

<footer>
© 2026 TVIliria — Albanian Media in America
</footer>

<script>

async function loadNews() {

const container =
document.getElementById("newsContainer");

try {

const indexResponse =
await fetch("news/index.json");

if (!indexResponse.ok) {
throw new Error("Lista e lajmeve nuk u gjet");
}

const files =
await indexResponse.json();

container.innerHTML = "";

for (let i = 0; i < files.length; i++) {

const response =
await fetch("news/" + files[i]);

if (!response.ok) {
continue;
}

const news =
await response.json();

const article =
document.createElement("article");

article.className = "news";

article.innerHTML = `

<h2>
${news.titulli}
</h2>

<div class="date">
📅 ${news.data}
</div>

<div class="summary">
${news.permbledhje}
</div>

<button class="read">
LEXO MË SHUMË
</button>

<div class="full">
<p>
${news.teksti}
</p>
</div>

`;

const button =
article.querySelector(".read");

const full =
article.querySelector(".full");

button.addEventListener("click", function() {

full.style.display = "block";

button.style.display = "none";

});

container.appendChild(article);
}

if (!container.innerHTML.trim()) {

container.innerHTML =
"<p>Nuk ka lajme të publikuara.</p>";

}

} catch (error) {

container.innerHTML =
"<p>Nuk u ngarkuan lajmet.</p>";

}

}

loadNews();

</script>

</body>
</html>
